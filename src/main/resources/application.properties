spring.application.name=ahorra-tank
server.servlet.context-path=${SERVER_SERVLET_CONTEXT_PATH:/system/api}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5436/ahorra_tank}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:ahorra}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:ahorra123}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_FORMAT_SQL:false}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

server.port=${PORT:8080}

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://10.0.2.2:5173}
