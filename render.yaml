services:
  - type: web
    name: ahorra-tank-api
    env: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: SERVER_SERVLET_CONTEXT_PATH
        value: /system/api
      - key: SPRING_JPA_SHOW_SQL
        value: false
      - key: SPRING_JPA_FORMAT_SQL
        value: false
      - key: APP_CORS_ALLOWED_ORIGINS
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
